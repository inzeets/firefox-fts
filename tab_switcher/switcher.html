<html>
<head>
	<meta charset="utf-8">
	<title>Fast Tab Switcher</title>

	<style>
		html, body {
			width: 100%;
			height: 100%;
		}

		html, #search_input {
			color: #e1e1e1 !important;
			background: #040c10;
			font-family: "Segoe UI" !important;
			font-size: 12px !important;
		}

		body {
			margin: 0;
			display: flex;
			flex-direction: column;
		}

		#search_input {
			flex: 0;
			-moz-appearance: none !important;
			appearance: none !important;
			font-size: 13px !important;
			padding: 2px 4px;
			color: #ffcf8a !important;
		}

		#tabs_table__container {
			flex: 1;
			overflow-y: scroll;
		}

		#tabs_table {
			width: 100%;
			overflow: hidden;
			white-space: nowrap;
			text-overflow: ellipsis;
			table-layout: fixed;
			border: 0;
			font-size: 13px;
		}

		#tabs_table td {
			overflow: hidden;
			text-overflow: ellipsis;
			padding-top: 4px;
			padding-bottom: 4px;
			cursor: default;
			-moz-user-select: none;
		}

		thead { display: none; }

		td:nth-child(1) { width: 16px; padding-left: 5px; padding-right: 5px; }
		td img { width: 16px !important; height: 16px !important; display: block; }

		.tabs_table__column_title {
			width: 50%;
		}

		.tabs_table__selected {
			background: #5a3a1a !important;
			color: #ffcf8a !important;
			text-shadow: 0 0 2px #000000, 0 0 1px #000000 !important;
		}

		img[src^="chrome://"] {
			width: 0 !important;
			height: 0 !important;
			visibility: hidden;
		}
	</style>
</head>
<body>

<input id="search_input"></input>

<div id="tabs_table__container">
	<table id="tabs_table" cellspacing="0">
		<col class="tabs_table__column_icon">
		<col class="tabs_table__column_title">
		<col class="tabs_table__column_url">

		<thead>
			<tr>
				<th></th>
				<th>Title</th>
				<th>Url</th>
			</tr>
		</thead>

		<tbody>
		</tbody>
	</table>
</div>

<script src="switcher.js"></script>

</body>
</html>
